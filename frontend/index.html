<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Anime Shop</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-body">

  <!-- ✅ Background Video -->
  <video class="bg-video" autoplay muted loop playsinline>
    <source src="assets/blade.mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>

  <!-- ✅ Login/Register Container Appears OVER Video -->
  <div class="login-container content-overlay">
    <h1>Anime Store Login</h1>

    <form id="loginForm" method="POST" action="http://localhost:3000/login">
      <input type="text" name="email" placeholder="Email" required><br>
      <input type="password" name="password" placeholder="Password" required><br>
      <button type="submit">Login</button>
    </form>

    <p>Don’t have an account?</p>

    <form id="registerForm" method="POST" action="http://localhost:3000/register">
      <input type="text" name="username" placeholder="Username" required><br>
      <input type="email" name="email" placeholder="Email" required><br>
      <input type="password" name="password" placeholder="Password" required><br>
      <button type="submit">Register</button>
    </form>
  </div>

</body>
</html>
